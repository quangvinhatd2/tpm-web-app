<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Hệ thống Quản lý TPM HPCBANVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0, 84, 166, 0.85), rgba(0, 40, 80, 0.9)), 
                        url('https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&q=80&w=2070');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            /* FIX: bỏ height:100vh cố định, dùng min-height để scroll được trên mobile nhỏ */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            /* FIX: padding thay vì padding-top cứng để tránh tràn */
            padding: 24px 16px;
            box-sizing: border-box;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
            padding: 1.75rem 2rem;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .evn-blue { color: #0054A6; }
        .bg-evn-orange { background-color: #F58220; }

        .input-group input:focus {
            border-color: #0054A6;
            box-shadow: 0 0 0 3px rgba(0, 84, 166, 0.2);
            outline: none;
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-in { animation: slideIn 0.4s ease-out; }

        /* FIX: Nút bấm dùng padding đủ lớn cho ngón tay (min 44px touch target) */
        .btn-login {
            width: 100%;
            background-color: #F58220;
            color: white;
            font-weight: 700;
            padding: 0.875rem 1rem;
            border-radius: 0.875rem;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s, transform 0.15s;
            box-shadow: 0 4px 15px rgba(245, 130, 32, 0.35);
            min-height: 48px; /* touch target */
        }
        .btn-login:hover { background-color: #E67310; transform: scale(1.01); }
        .btn-login:active { transform: scale(0.98); }

        /* Flash messages */
        .flash-error {
            background: #fff0f0;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            border-radius: 0.75rem;
            padding: 10px 14px;
            font-size: 0.82rem;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 1rem;
        }
        .flash-error i { flex-shrink: 0; margin-top: 2px; color: #ef4444; }

        /* Input đủ lớn để gõ trên mobile */
        .login-input {
            width: 100%;
            padding: 0.75rem 0.875rem 0.75rem 2.5rem;
            border: 1.5px solid #d1d5db;
            border-radius: 0.875rem;
            background: #f9fafb;
            font-size: 1rem; /* không nhỏ hơn 16px để iOS không zoom */
            font-family: 'Inter', sans-serif;
            color: #111827;
            box-sizing: border-box;
            transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none; /* tránh iOS style riêng */
        }
        .login-input:focus {
            border-color: #0054A6;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0, 84, 166, 0.15);
            outline: none;
        }

        /* Tiêu đề: wrap được, không whitespace-nowrap */
        .page-title {
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 0.03em;
            line-height: 1.4;
            /* FIX: bỏ whitespace-nowrap */
        }

        .support-text {
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: center;
            opacity: 0.6;
            margin-top: 1.25rem;
            /* FIX: bỏ whitespace-nowrap, cho phép wrap */
            word-break: break-word;
        }

        .copyright {
            font-size: 0.65rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            text-align: center;
            /* FIX: bỏ whitespace-nowrap */
            word-break: break-word;
        }

        /* Giới hạn chiều rộng card */
        .card-wrapper {
            width: 100%;
            max-width: 420px;
        }
    </style>
</head>
<body>

    <div class="card-wrapper animate-slide-in">
        
        <!-- Header ngoài card -->
        <div style="text-align:center; margin-bottom: 1.25rem;">
            <div style="
                display: inline-flex; align-items: center; justify-content: center;
                width: 64px; height: 64px;
                background: linear-gradient(135deg, #dbeafe, #ffffff);
                border-radius: 1rem;
                box-shadow: 0 10px 30px rgba(0,0,0,0.25);
                margin-bottom: 0.875rem;
            ">
                <i class="fa-solid fa-bolt-lightning" style="font-size: 1.75rem; color: #0054A6;"></i>
            </div>
            <h1 class="page-title">
                Hệ thống Đánh giá bảo trì tự quản TPM
            </h1>
        </div>

        <!-- Card đăng nhập -->
        <div class="glass-card">
            <!-- Thanh màu cam trên đầu card -->
            <div style="position:absolute; top:0; left:0; right:0; height:4px; background:#F58220; border-radius:1.5rem 1.5rem 0 0;"></div>

            <h2 style="font-size:1.6rem; font-weight:900; color:#1f2937; text-align:center; margin-bottom:1.25rem; margin-top:0.25rem;">
                Đăng nhập
            </h2>

            <!-- FIX: Flash messages hiển thị lỗi từ Flask -->
            {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                <div class="flash-error">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="post" style="display:flex; flex-direction:column; gap:1.1rem;">
                <!-- Username -->
                <div class="input-group">
                    <label style="display:block; font-size:0.82rem; font-weight:700; color:#4b5563; margin-bottom:6px; margin-left:2px;">
                        Tên đăng nhập
                    </label>
                    <div style="position:relative;">
                        <span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#9ca3af; pointer-events:none;">
                            <i class="fa-solid fa-user" style="font-size:0.9rem;"></i>
                        </span>
                        <input type="text" name="username" required autocomplete="username"
                               class="login-input"
                               placeholder="Nhập tài khoản kỹ sư...">
                    </div>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label style="display:block; font-size:0.82rem; font-weight:700; color:#4b5563; margin-bottom:6px; margin-left:2px;">
                        Mật khẩu
                    </label>
                    <div style="position:relative;">
                        <span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#9ca3af; pointer-events:none;">
                            <i class="fa-solid fa-lock" style="font-size:0.9rem;"></i>
                        </span>
                        <input type="password" name="password" required autocomplete="current-password"
                               class="login-input"
                               placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <span>ĐĂNG NHẬP NGAY</span>
                    <i class="fa-solid fa-arrow-right-long"></i>
                </button>
            </form>

            <div style="margin-top:1.25rem; padding-top:1rem; border-top:1px solid #f3f4f6;">
                <p class="copyright">
                    &copy; 2026 EVNGENCO1 — Công ty Thuỷ điện Bản Vẽ
                </p>
            </div>
        </div>
        
        <!-- Hỗ trợ kỹ thuật -->
        <p class="support-text">
            Hỗ trợ kỹ thuật: quangvinhatd2@gmail.com | Version 1.0.0
        </p>
    </div>

</body>
</html>
